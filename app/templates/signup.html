{% extends "auth_base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h2>Create your account</h2>
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/signup">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" autocomplete="name" required value="{{ name or '' }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
  <label for="password">Password <span class="hint">at least 8 characters</span></label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
  <button class="btn primary" type="submit">Sign up</button>
</form>
<p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
{% endblock %}
